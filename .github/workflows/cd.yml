name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$REPOSITORY:latest" \
            --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/$REPOSITORY:latest"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Deploy app to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY
          script_stop: true
          command_timeout: 5m
          script: |
            set -eu

            ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
            printf '%s' "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            unset ECR_PASSWORD

            cd /home/ubuntu/momentory
            docker compose --env-file .env -f compose.prod.yml pull app
            docker compose --env-file .env -f compose.prod.yml up -d app

            deadline=$(( $(date +%s) + 60 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              remaining=$(( deadline - $(date +%s) ))
              if health_response=$(curl --fail --silent --show-error --connect-timeout 3 --max-time "$remaining" http://localhost:8080/actuator/health); then
                if printf '%s' "$health_response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
                  echo "Application health status is UP."
                  exit 0
                fi
              fi

              remaining=$(( deadline - $(date +%s) ))
              if [ "$remaining" -le 0 ]; then
                break
              fi
              if [ "$remaining" -lt 5 ]; then
                sleep "$remaining"
              else
                sleep 5
              fi
            done

            echo "Application did not become healthy within 60 seconds."
            docker compose --env-file .env -f compose.prod.yml logs --tail=200 app
            exit 1
