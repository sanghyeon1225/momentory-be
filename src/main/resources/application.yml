spring:
  application:
    name: momentory-be
  jackson:
    time-zone: ${app.time-zone}
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

app:
  time-zone: Asia/Seoul

jwt:
  issuer: momentory-api
  audience: momentory-app
  access-token-expiration: 30m
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  secret: ${JWT_SECRET}

kakao:
  api:
    base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    app-id: ${KAKAO_APP_ID}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_READ_TIMEOUT:5s}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
